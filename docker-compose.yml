services:
  app:
    build: ./app
    container_name: app
    ports:
      - "5000:5000"
    depends_on:
      metadata:
        condition: service_healthy
      storage:
        condition: service_healthy
    networks:
      - ctfnet
    restart: always

  metadata:
    build: ./metadata
    container_name: metadata
    networks:
      - ctfnet
    volumes:
      - shared-data:/data
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost/')"]
      interval: 10s
      timeout: 3s
      retries: 5

  storage:
    build: ./storage
    container_name: storage
    networks:
      - ctfnet
    volumes:
      - shared-data:/data
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  ctfnet:
    driver: bridge

volumes:
  shared-data:
